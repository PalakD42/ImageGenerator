<!DOCTYPE html>
<html>
<head>
  <title>AI Image Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    async function generateImage() {
      const output = document.querySelector('#output');
      const btn = document.querySelector('#generate-btn');

      output.innerHTML = '<p class="text-muted">Generating image...</p>';
      btn.disabled = true;

      const formData = new FormData(document.querySelector('#image-form'));

      const response = await fetch('/generate', {
        method: 'POST',
        body: formData
      });

      const result = await response.text();

      if (result.startsWith('data:image')) {
        output.innerHTML =
          '<img src="' + result + '" class="img-fluid rounded">' +
          '<br><a href="' + result + '" download="generated.png" class="btn btn-success mt-2">Download</a>';
      } else {
        output.innerHTML = '<p class="text-danger">' + result + '</p>';
      }

      btn.disabled = false;
    }
  </script>
</head>
<body>
<div class="container mt-4">
  <h1>AI Image Generator</h1>

  <form id="image-form" onsubmit="event.preventDefault(); generateImage();">
    <div class="mb-3">
      <label class="form-label">Describe the image:</label>
      <input type="text"
             class="form-control"
             name="components"
             required>
    </div>

    <button id="generate-btn" class="btn btn-primary">
      Generate Image
    </button>
  </form>

  <div id="output" class="mt-3"></div>
</div>
</body>
</html>
